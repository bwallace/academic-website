<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ bio.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <nav>
        <a href="index.html" {% if active == 'about' %}class="active"{% endif %}>Home</a>
        <a href="publications.html" {% if active == 'publications' %}class="active"{% endif %}>Publications</a>
        <a href="students.html" {% if active == 'students' %}class="active"{% endif %}>Students</a>
        <a href="teaching.html" {% if active == 'teaching' %}class="active"{% endif %}>Teaching</a>
      </nav>
      <nav>
        <a href="static/bcw-cv.pdf" class="nav-cv">CV</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>{{ bio.name }} &middot; Khoury College of Computer Sciences, Northeastern University</p>
  </footer>
</body>
</html>
